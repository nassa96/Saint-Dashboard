# ============================================================
# Render Blueprint for SAINT CORE
# Deploy: push this repo to GitHub, then in Render click
#   New + → Blueprint → pick this repo. Render reads this file.
# See RENDER.md for the full walkthrough.
# ============================================================
services:
  - type: web
    name: saint-core
    runtime: node
    plan: starter            # Starter+ runs 24/7. The Free plan SLEEPS when idle — bad for a bot.
    region: oregon           # pick the region closest to you / your exchange
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Persistent disk for the PAPER portfolio/history and optional credentials; live arms never resume after restart.
    # (Disks require a paid instance type; remove this block on Free.)
    disk:
      name: saint-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"        # Render sets PORT; the server already honors process.env.PORT
      # ---- PAPER-only tester rollout; live arming is blocked in this release. ----
      - key: TRADING_MODE
        value: PAPER
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: LIVE_TRADING_CONFIRM
        value: ""
      - key: ONCHAIN_TRADING_ENABLED
        value: "false"
      - key: USE_TESTNET
        value: "true"
      # ---- Protect the dashboard (REQUIRED before exposing publicly) ----
      - key: DASHBOARD_PASSWORD
        generateValue: true   # generated password enables auth; retrieve/share it securely from Render
      - key: SESSION_SECRET
        generateValue: true   # Render generates a strong persistent random signing secret
      # ---- Conservative PAPER demo profile (not an account balance) ----
      - key: STARTING_EQUITY
        value: "1000"
      - key: MIN_TRADE_USD
        value: "10"
      - key: MAX_TRADE_USD
        value: "25"
      - key: PER_TRADE_RISK_PCT
        value: "0.01"
      - key: MAX_POSITION_PCT
        value: "0.10"
      - key: MAX_PORTFOLIO_RISK_PCT
        value: "0.40"
      - key: MAX_DAILY_DRAWDOWN_PCT
        value: "0.05"
      - key: SOFT_BRAKE_DRAWDOWN_PCT
        value: "0.025"
      - key: MIN_SIGNAL_CONFIDENCE
        value: "0.65"
      - key: TRADE_UNIVERSE
        value: BTC-USD,ETH-USD,SOL-USD
      - key: STRATEGY
        value: momentum
      - key: PRIMARY_EXCHANGE
        value: coinbase
      # ---- Exchange keys: set these in the Render dashboard (never in git) ----
      - key: COINBASE_API_KEY_NAME
        sync: false
      - key: COINBASE_API_KEY_SECRET
        sync: false
      - key: COINBASE_PORTFOLIO_UUID
        sync: false
